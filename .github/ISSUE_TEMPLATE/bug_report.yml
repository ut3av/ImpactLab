name: Bug Report
description: Report an issue, incorrect regulatory citation, or calculation defect.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in NIYAMLENS. Please provide clear details so we can reproduce and verify it against the *M.P. Bhumi Vikas Rules, 2012*.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A concise summary of the issue.
      placeholder: e.g., Rule 56 rear open space calculation fails for 120 sq m plot
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What question or inputs did you submit?
      placeholder: |
        1. Query submitted: "..."
        2. Inputs provided: plot_area_sqm = 120, road_width_m = 9
        3. Observed response status: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened according to the official rulebook?
      placeholder: Cite the relevant Rule number, table row, or PDF page if known.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What did the application actually output?
    validations:
      required: true
  - type: input
    id: rule_ref
    attributes:
      label: Relevant Rule Reference (if applicable)
      description: e.g., Rule 56, Table 4, PDF page 78
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment & OS
      description: Operating system, browser, or Python version used.
      placeholder: Windows 11 / Python 3.11 / Chrome 124
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output (Redacted)
      description: Paste any server output or browser console logs with all API keys and personal information removed.
    validations:
      required: false
